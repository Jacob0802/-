<!DOCTYPE html>
<html>
<head>
    <title>Decking Sunshine Coast — Quote Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f14; color: #e8e8ef; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .msg { text-align: center; max-width: 480px; }
        .msg h2 { margin-bottom: 8px; }
        .msg p { color: #999; margin: 8px 0; }
        .btn { display: inline-block; margin-top: 16px; padding: 14px 32px; background: #6C5CE7; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #7c6ef0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .upload-area { margin: 20px 0; padding: 24px; border: 2px dashed #333; border-radius: 10px; cursor: pointer; transition: border-color 0.2s; }
        .upload-area:hover { border-color: #6C5CE7; }
        .upload-area img { max-height: 80px; max-width: 200px; }
        .upload-area input { display: none; }
        .step { color: #6C5CE7; font-weight: bold; }
        #logo-status { font-size: 14px; color: #999; }
    </style>
</head>
<body>
    <div class="msg">
        <h2>Decking Sunshine Coast</h2>
        <p>Quote PDF Generator</p>

        <div class="upload-area" id="upload-area" onclick="document.getElementById('logo-file').click()">
            <input type="file" id="logo-file" accept="image/*">
            <p id="logo-status"><span class="step">Step 1:</span> Click here to upload your logo</p>
            <div id="logo-img"></div>
        </div>

        <button class="btn" id="btn-generate" onclick="generate()">
            Generate & Download PDF
        </button>
        <p id="status"></p>
    </div>

    <script>
        var logoData = null;

        document.getElementById('logo-file').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                logoData = ev.target.result;
                document.getElementById('logo-img').innerHTML = '<img src="' + logoData + '" alt="Logo">';
                document.getElementById('logo-status').innerHTML = '<span class="step">Logo loaded!</span> Click the button below to generate.';
            };
            reader.readAsDataURL(file);
        });

        function generate() {
            if (!logoData) {
                document.getElementById('status').textContent = 'Please upload your logo first.';
                document.getElementById('status').style.color = '#e17055';
                return;
            }

            document.getElementById('status').textContent = 'Generating...';
            document.getElementById('status').style.color = '#999';

            var items = [
                { num: 1, desc: 'Site inspection & pre-work assessment', detail: 'Structural assessment of deck framing, post bases, and bearer connections', amount: 0 },
                { num: 2, desc: 'Remove & dispose of 3\u00d7 damaged structural posts', detail: 'Safe removal of existing 90\u00d790mm H4 treated pine posts; disposal off-site', amount: 480 },
                { num: 3, desc: 'Supply & install 3\u00d7 new structural posts', detail: '90\u00d790mm H4 treated pine, 1.8m lengths; posts to match existing height', amount: 720 },
                { num: 4, desc: 'Post base hardware & concrete footings', detail: '3\u00d7 galvanised adjustable post bases (Pryda or equiv.); re-pour or patch existing concrete pads as required', amount: 640 },
                { num: 5, desc: 'Bearer & joist re-connection', detail: 'Re-secure bearers to new posts; replace damaged joist hangers and nails/bolts as required', amount: 580 },
                { num: 6, desc: 'Deck board re-securing', detail: 'Lift, re-lay, and re-fix affected deck boards over repaired framing', amount: 420 },
                { num: 7, desc: 'Structural timber repairs \u2014 incidentals', detail: 'Replace any secondary framing members found to be damaged during works (allowance)', amount: 350 },
                { num: 8, desc: 'Labour \u2014 carpentry', detail: '2\u00d7 carpenters, estimated 3 days', amount: 2880 },
                { num: 9, desc: 'Plant & equipment', detail: 'Post-hole digger hire, generator, tools', amount: 280 },
                { num: 10, desc: 'Site cleanup & waste removal', detail: 'All debris removed; site left broom-clean', amount: 180 }
            ];

            var subtotal = 0;
            for (var i = 0; i < items.length; i++) subtotal += items[i].amount;
            var tax = subtotal * 0.10;
            var total = subtotal + tax;

            function money(n) {
                return 'A$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }

            // Table body
            var tableBody = [
                [
                    { text: '#', style: 'th', alignment: 'center' },
                    { text: 'DESCRIPTION', style: 'th' },
                    { text: 'DETAILS', style: 'th' },
                    { text: 'AMOUNT', style: 'th', alignment: 'right' }
                ]
            ];

            for (var j = 0; j < items.length; j++) {
                var it = items[j];
                var amtText = it.amount === 0 ? '$0\n(included)' : money(it.amount);
                tableBody.push([
                    { text: String(it.num), alignment: 'center', color: '#555', fontSize: 9 },
                    { text: it.desc, bold: true, fontSize: 10, color: '#1a1a2e' },
                    { text: it.detail, fontSize: 9, color: '#555' },
                    { text: amtText, alignment: 'right', fontSize: 10, color: '#1a1a2e', bold: true }
                ]);
            }

            // Totals
            var totalsBody = [
                [{ text: 'Subtotal (ex. GST)', alignment: 'right', color: '#888' }, { text: money(subtotal), alignment: 'right', color: '#333' }],
                [{ text: 'GST (10%)', alignment: 'right', color: '#888' }, { text: money(tax), alignment: 'right', color: '#333' }],
                [{ text: 'Total (inc. GST)', alignment: 'right', bold: true, fontSize: 14, color: '#1a1a2e' }, { text: money(total), alignment: 'right', bold: true, fontSize: 14, color: '#1a1a2e' }]
            ];

            var docDef = {
                content: [
                    // Header: Logo + QUOTE
                    {
                        columns: [
                            { image: logoData, fit: [160, 80] },
                            { stack: [
                                { text: 'QUOTE', fontSize: 28, bold: true, color: '#6C5CE7', alignment: 'right' },
                                { text: 'Quote-001', fontSize: 11, color: '#888', alignment: 'right' }
                            ]}
                        ],
                        columnGap: 20,
                        margin: [0, 0, 0, 24]
                    },

                    // From / Prepared For
                    {
                        columns: [
                            { stack: [
                                { text: 'FROM', fontSize: 9, bold: true, color: '#999' },
                                { text: 'Decking Sunshine Coast', fontSize: 13, bold: true, color: '#1a1a2e', margin: [0, 4, 0, 2] },
                                { text: 'decksunshine@gmail.com.au', fontSize: 10, color: '#555' },
                                { text: '0753158386', fontSize: 10, color: '#555' },
                                { text: 'sunshinecoastdeckings.com', fontSize: 10, color: '#6C5CE7' }
                            ]},
                            { stack: [
                                { text: 'PREPARED FOR', fontSize: 9, bold: true, color: '#999' },
                                { text: '______________________________', fontSize: 10, color: '#ddd', margin: [0, 6, 0, 0] },
                                { text: '______________________________', fontSize: 10, color: '#ddd', margin: [0, 4, 0, 0] },
                                { text: '______________________________', fontSize: 10, color: '#ddd', margin: [0, 4, 0, 0] }
                            ]}
                        ],
                        margin: [0, 0, 0, 20]
                    },

                    // Meta row
                    {
                        table: {
                            widths: ['*', '*', '*'],
                            body: [[
                                { stack: [{ text: 'DATE', fontSize: 8, bold: true, color: '#999' }, { text: 'Apr 11, 2026', fontSize: 11, bold: true, color: '#333', margin: [0, 2, 0, 0] }] },
                                { stack: [{ text: 'VALID FOR', fontSize: 8, bold: true, color: '#999' }, { text: '30 days', fontSize: 11, bold: true, color: '#333', margin: [0, 2, 0, 0] }] },
                                { stack: [{ text: 'CURRENCY', fontSize: 8, bold: true, color: '#999' }, { text: 'AUD', fontSize: 11, bold: true, color: '#333', margin: [0, 2, 0, 0] }] }
                            ]]
                        },
                        layout: {
                            fillColor: function() { return '#f5f5fa'; },
                            hLineWidth: function() { return 0; },
                            vLineWidth: function() { return 0; },
                            paddingLeft: function() { return 10; },
                            paddingRight: function() { return 10; },
                            paddingTop: function() { return 8; },
                            paddingBottom: function() { return 8; }
                        },
                        margin: [0, 0, 0, 20]
                    },

                    // Scope heading
                    { text: 'Scope of Works \u2014 Deck Post Replacement & Structural Repair', fontSize: 12, bold: true, color: '#1a1a2e', margin: [0, 0, 0, 12] },

                    // Line Items
                    {
                        table: {
                            headerRows: 1,
                            widths: [20, '*', '*', 70],
                            body: tableBody
                        },
                        layout: {
                            hLineWidth: function(i, node) { return (i === 0 || i === 1 || i === node.table.body.length) ? 1 : 0.5; },
                            vLineWidth: function() { return 0; },
                            hLineColor: function(i) { return i <= 1 ? '#ddd' : '#f0f0f0'; },
                            paddingTop: function() { return 8; },
                            paddingBottom: function() { return 8; },
                            paddingLeft: function(i) { return i === 0 ? 4 : 6; },
                            paddingRight: function(i, node) { return i === node.table.widths.length - 1 ? 4 : 6; }
                        },
                        margin: [0, 0, 0, 20]
                    },

                    // Totals
                    {
                        columns: [
                            { width: '*', text: '' },
                            {
                                width: 260,
                                table: { widths: ['*', 'auto'], body: totalsBody },
                                layout: {
                                    hLineWidth: function(i) { return i === 2 ? 1 : 0; },
                                    vLineWidth: function() { return 0; },
                                    hLineColor: function() { return '#6C5CE7'; },
                                    paddingTop: function() { return 5; },
                                    paddingBottom: function() { return 5; }
                                }
                            }
                        ],
                        margin: [0, 0, 0, 24]
                    },

                    // Payment Terms
                    { text: 'Payment', fontSize: 9, bold: true, color: '#999', margin: [0, 0, 0, 4] },
                    { text: '50% deposit required to confirm booking. Balance due on completion.', fontSize: 10, color: '#555', margin: [0, 0, 0, 16] },

                    // Notes
                    { text: 'Notes', fontSize: 9, bold: true, color: '#999', margin: [0, 0, 0, 4] },
                    { text: 'All prices include materials and labour unless otherwise stated. Work is subject to site access and weather conditions. Item 7 (structural timber repairs) is an allowance \u2014 actual cost may vary depending on site conditions.', fontSize: 10, color: '#555', margin: [0, 0, 0, 16] },

                    // Acceptance line + signature
                    {
                        canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, lineColor: '#ddd' }],
                        margin: [0, 8, 0, 16]
                    },

                    { text: 'This quote constitutes an offer to perform the works described. Acceptance occurs upon the client signing the quote or paying the deposit, whichever occurs first.', fontSize: 9, color: '#555', italics: true, margin: [0, 0, 0, 24] },

                    // Signature block
                    {
                        columns: [
                            { stack: [
                                { text: 'CLIENT ACCEPTANCE', fontSize: 8, bold: true, color: '#999' },
                                { text: ' ', fontSize: 30 },
                                { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 200, y2: 0, lineWidth: 0.5, lineColor: '#999' }] },
                                { text: 'Signature', fontSize: 8, color: '#999', margin: [0, 4, 0, 0] },
                                { text: ' ', fontSize: 16 },
                                { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 200, y2: 0, lineWidth: 0.5, lineColor: '#999' }] },
                                { text: 'Date', fontSize: 8, color: '#999', margin: [0, 4, 0, 0] }
                            ]},
                            { stack: [
                                { text: 'ISSUED BY', fontSize: 8, bold: true, color: '#999' },
                                { text: ' ', fontSize: 30 },
                                { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 200, y2: 0, lineWidth: 0.5, lineColor: '#999' }] },
                                { text: 'Decking Sunshine Coast', fontSize: 8, color: '#999', margin: [0, 4, 0, 0] }
                            ]}
                        ]
                    }
                ],
                footer: function(currentPage, pageCount) {
                    return {
                        columns: [
                            { text: 'Page ' + currentPage + ' of ' + pageCount, alignment: 'left', fontSize: 8, color: '#bbb', margin: [40, 0, 0, 0] },
                            { text: 'Decking Sunshine Coast  |  0753158386  |  sunshinecoastdeckings.com', alignment: 'right', fontSize: 8, color: '#bbb', margin: [0, 0, 40, 0] }
                        ]
                    };
                },
                defaultStyle: { font: 'Roboto' },
                pageSize: 'A4',
                pageMargins: [40, 40, 40, 60],
                styles: {
                    th: { fontSize: 8, bold: true, color: '#999' }
                }
            };

            try {
                pdfMake.createPdf(docDef).download('Quote-001-Decking-Sunshine-Coast.pdf');
                document.getElementById('status').textContent = 'PDF downloaded!';
                document.getElementById('status').style.color = '#00b894';
            } catch (err) {
                document.getElementById('status').textContent = 'Error: ' + err.message;
                document.getElementById('status').style.color = '#e17055';
                console.error(err);
            }
        }
    </script>
</body>
</html>
